name: Lighthouse and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Generated site is up to date with src/
        run: |
          python3 tools/build.py
          git diff --exit-code -- site
          test -z "$(git status --porcelain -- site)"
      - run: npm ci
      - name: Unit gates (JSON-LD schema.org shape, crawl files, head tags, internal links, redirect Worker)
        run: npm run test:unit
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Browser gates against wrangler pages dev (identity assets and content types, PWA installability, every internal and family link)
        env:
          CI: "true"
          WRANGLER_SEND_METRICS: "false"
        run: npx playwright test
      - name: The atlas.avarok.net redirect Worker builds
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npx wrangler deploy --dry-run --config workers/atlas-redirect/wrangler.toml --outdir .wrangler/atlas-redirect

  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Generated site is up to date with src/
        run: |
          python3 tools/build.py
          git diff --exit-code -- site
          test -z "$(git status --porcelain -- site)"
      - name: Lighthouse CI (mobile, 3 runs per page, every category must be 100)
        run: npx --yes @lhci/cli@0.15.1 autorun
      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14

  deploy:
    needs: [gates, lighthouse]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Deploy site/ to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.153.0 pages deploy site --project-name=avarok-net --branch=main --commit-dirty=true

  # atlas.avarok.net -> https://atlasinference.io/engine (workers/atlas-redirect). The token needs
  # Account > Workers Scripts: Edit, and on the avarok.net zone Workers Routes: Edit and Zone: Read
  # (wrangler creates the custom domain and its DNS record). See workers/atlas-redirect/wrangler.toml.
  deploy-atlas-redirect:
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci
      - name: Deploy the atlas.avarok.net redirect Worker
        env:
          WRANGLER_SEND_METRICS: "false"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config workers/atlas-redirect/wrangler.toml
