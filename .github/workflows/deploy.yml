name: Lighthouse and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Generated site is up to date with src/
        run: |
          python3 tools/build.py
          git diff --exit-code -- site
          test -z "$(git status --porcelain -- site)"
      - run: npm ci
      - name: Unit gates (JSON-LD schema.org shape, crawl files, head tags, internal links, redirect Worker)
        run: npm run test:unit
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Browser gates against wrangler pages dev (identity assets and content types, PWA installability, every internal and family link)
        env:
          CI: "true"
          WRANGLER_SEND_METRICS: "false"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx playwright test
      - name: The atlas.avarok.net redirect Worker builds
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npx wrangler deploy --dry-run --config workers/atlas-redirect/wrangler.toml --outdir .wrangler/atlas-redirect

  # GeoHarness (https://github.com/Avarok-Cybersecurity/geoharness) runs tools/build.py, writes markdown twins and
  # llms-full.txt, adds Content Signals to robots.txt (the site's own sitemap.xml and llms.txt are kept), gates on
  # the GEO score and on 100 in all four Lighthouse categories for every sitemap URL (served locally by wrangler
  # with the deploy's own config), deploys an assets-only Cloudflare Worker on avarok.net and www.avarok.net,
  # configures the zone and verifies the live site, rolling back if the live checks fail. Pull requests run the
  # same pipeline with deploy: false: no secrets, no Cloudflare API call, no zone change. Settings: geoharness.toml.
  #
  # extra-optimizations leaves email_obfuscation alone: it is a zone-wide setting that rewrites the HTML of every
  # proxied host on avarok.net (work.avarok.net, gitlab, auth, ...), and avarok.net does not need it changed.
  # The rest only assert values the zone already has (rocket_loader off, early_hints/http3/brotli/tiered cache on,
  # bot fight mode and AI-bot blocking off) or are scoped to these two hosts (the zstd compression rule).
  dry-run:
    name: Build and gate (dry run)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: GeoHarness dates pages from git (content.sources); a shallow clone dates every page HEAD.
          fetch-depth: 0
      - name: GeoHarness (dry run, deploy false)
        id: geoharness
        uses: Avarok-Cybersecurity/geoharness@d731c52513049f1042758af963dd1d16a9eea0b3 # main
        with:
          site-path: .
          adapter: python
          output-dir: site
          target: workers
          project-name: avarok-net
          domains: |
            avarok.net
            www.avarok.net
          lighthouse: "true"
          lighthouse-max-urls: "13"
          geo-min-score: "90"
          extra-optimizations: all -email_obfuscation
          deploy: "false"

  deploy:
    name: Build, gate, deploy, verify
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Never cancel a deploy half way: runs for main queue behind each other.
    concurrency:
      group: deploy-avarok.net
      cancel-in-progress: false
    environment:
      name: production
      url: https://avarok.net
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: GeoHarness dates pages from git (content.sources); a shallow clone dates every page HEAD.
          fetch-depth: 0
      - name: GeoHarness (deploy)
        id: geoharness
        uses: Avarok-Cybersecurity/geoharness@d731c52513049f1042758af963dd1d16a9eea0b3 # main
        with:
          # A repository secret scoped to GeoHarness's permission groups on the avarok.net zone; the org-wide
          # CLOUDFLARE_API_TOKEN stays with the atlas.avarok.net redirect job.
          cloudflare-api-token: ${{ secrets.GEOHARNESS_CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          site-path: .
          adapter: python
          output-dir: site
          target: workers
          project-name: avarok-net
          domains: |
            avarok.net
            www.avarok.net
          lighthouse: "true"
          lighthouse-max-urls: "13"
          geo-min-score: "90"
          extra-optimizations: all -email_obfuscation
          deploy: "true"
          # Pages owned both hosts (proxied CNAMEs to avarok-net.pages.dev). GeoHarness deletes those records and
          # binds each host to the Worker at once; the Pages project avarok-net stays as the way back.
          takeover-dns: "true"
          # A build that fails the live GEO audit or the production Lighthouse gate is replaced by the previous one.
          # The cut-over run has no earlier Worker version to go back to; GeoHarness says so and leaves it live.
          rollback-on-failure: "true"
      - name: Result
        env:
          GEO_SCORE: ${{ steps.geoharness.outputs.geo-score }}
          URL: ${{ steps.geoharness.outputs.url }}
        run: echo "GEO score $GEO_SCORE at $URL"

  # atlas.avarok.net -> https://atlasinference.io/engine (workers/atlas-redirect). The token needs
  # Account > Workers Scripts: Edit, and on the avarok.net zone Workers Routes: Edit and Zone: Read
  # (wrangler creates the custom domain and its DNS record). See workers/atlas-redirect/wrangler.toml.
  deploy-atlas-redirect:
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci
      - name: Deploy the atlas.avarok.net redirect Worker
        env:
          WRANGLER_SEND_METRICS: "false"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config workers/atlas-redirect/wrangler.toml
