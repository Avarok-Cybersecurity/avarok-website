# GeoHarness builds, audits, gates and deploys avarok.net with this file
# (see .github/workflows/deploy.yml and https://github.com/Avarok-Cybersecurity/geoharness/blob/main/docs/config.md).
# tools/build.py still writes robots.txt, sitemap.xml and llms.txt from src/data/site.json; GeoHarness keeps the
# site's sitemap.xml and llms.txt as they are and adds its Content-Signal groups to robots.txt.

[site]
origin = "https://avarok.net"
name = "Avarok Cybersecurity"
language = "en"

# The organization and its profiles as src/data/site.json states them (organization.sameAs).
[identity]
kind = "organization"
name = "Avarok Cybersecurity"
url = "https://avarok.net"
sameAs = [
  "https://github.com/Avarok-Cybersecurity",
  "https://blog.avarok.net/",
  "https://www.linkedin.com/company/avarok/",
  "https://crates.io/crates/citadel_sdk",
]

# Search, answers that cite the site, and training are all allowed (owner decision 2026-11-19), matching
# robots.txt, which admits the training crawlers.
[contentSignal]
search = true
aiInput = true
aiTrain = true

# The groups mirror src/data/site.json crawlers: search and answer engines, the agents that fetch for a user,
# and training crawlers, all allowed.
[[bots]]
group = "search"
tokens = ["Googlebot", "Bingbot", "Applebot", "DuckDuckBot", "OAI-SearchBot", "PerplexityBot", "Claude-SearchBot", "DuckAssistBot"]
allow = ["/"]

[[bots]]
group = "user"
tokens = ["ChatGPT-User", "Perplexity-User", "Claude-User"]
allow = ["/"]

[[bots]]
group = "training"
tokens = ["GPTBot", "ClaudeBot", "Google-Extended", "Applebot-Extended", "CCBot", "meta-externalagent"]
allow = ["/"]

[[bots]]
group = "other"
tokens = ["*"]
allow = ["/"]

[content]
mainSelector = "main"
# site/ is generated by tools/build.py, so a page's date is the newest commit of its own source, plus
# src/data/site.json for the pages whose body is filled from it (product cards, facts, family, open source).
# The shared chrome (head, header, footer, CSS) is left out on purpose: it changes every page at once.
[content.sources]
"/" = ["src/pages/index.html", "src/data/site.json"]
"/about/" = ["src/pages/about.html"]
"/open-source/" = ["src/pages/open-source.html", "src/data/site.json"]
"/citadel-workspace/" = ["src/pages/citadel-workspace.html", "src/data/site.json"]
"/citadel-protocol/" = ["src/pages/citadel-protocol.html", "src/data/site.json"]
"/citadel-agent/" = ["src/pages/citadel-agent.html", "src/data/site.json"]
"/synchronized-work/" = ["src/pages/synchronized-work.html", "src/data/site.json"]
"/atlas-inference/" = ["src/pages/atlas-inference.html", "src/data/site.json"]
"/certifiedcopy/" = ["src/pages/certifiedcopy.html", "src/data/site.json"]
"/privacy/" = ["src/pages/privacy.html"]
"/terms/" = ["src/pages/terms.html"]
"/cookie-policy/" = ["src/pages/cookie-policy.html"]
"/acceptable-use/" = ["src/pages/acceptable-use.html"]
"/offline/" = ["src/pages/offline.html"]

# The avarok.net zone injects the Cloudflare Web Analytics beacon; src/_headers already admits it.
[analytics]
cloudflareWebAnalytics = true

[llms]
summary = "Avarok Cybersecurity builds post-quantum security and infrastructure software in Rust: the open-source Citadel Protocol SDK and the products built on it."

[[llms.sections]]
title = "Company"
routes = ["/", "/about/", "/open-source/"]

[[llms.sections]]
title = "Products"
routes = ["/citadel-workspace/", "/citadel-protocol/", "/citadel-agent/", "/synchronized-work/", "/atlas-inference/", "/certifiedcopy/"]

[[llms.sections]]
title = "Legal"
routes = ["/privacy/", "/terms/", "/cookie-policy/", "/acceptable-use/"]
